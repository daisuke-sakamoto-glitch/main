name: Claude Auto Dev

# Issue にラベル "claude" が付いたら自動で開発を開始
on:
  issues:
    types: [labeled]

jobs:
  auto-dev:
    # "claude" ラベルが付いた時だけ実行
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            以下のGitHub Issueの内容を読んで、実装してください。

            タイトル: ${{ github.event.issue.title }}
            内容:
            ${{ github.event.issue.body }}

            手順:
            1. Issueの要件を理解する
            2. 必要なコードを実装する
            3. 動作確認（テストがあれば実行）
            4. 変更をコミットする

            注意:
            - 日本語でコミットメッセージを書いてください
            - 既存のコードスタイルに合わせてください
            - 不明点があればIssueにコメントしてください
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          timeout_minutes: 30
